name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Android SDK
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Patch game for Android voice
        run: |
          python3 - <<'PY'
          s = open("game.html", encoding="utf-8").read()
          R = [
            ('function vox(txt,who){if(!vz||mute)return;try{const ss=window.speechSynthesis;',
             'function vox(txt,who){if(!vz||mute)return;try{if(window.AndroidTTS){const nw=performance.now();if(who==="h"&&(nw-vl<1500||AndroidTTS.speaking()))return;vl=nw;AndroidTTS.speak(txt,who==="g"?.6:1.2,who==="g"?1.1:1.15,who==="g");return}const ss=window.speechSynthesis;'),
            ('const ch=e.k||e.al>0,sp=',
             'if(e.k===0&&e.al>0){e.sh=(e.sh||0)-dt;if(e.sh<=0){e.sh=3.5;const l2=pk1(GL);vox(l2[0],"g");say("🚨 Охранник: «"+l2[1]+"»")}}const ch=e.k||e.al>0,sp='),
            ('if(e.al<=0){snd(880,.09,', 'if(e.al<=0){e.sh=3.5;snd(880,.09,'),
          ]
          for a, b in R:
              if a in s and b not in s:
                  s = s.replace(a, b, 1)
              else:
                  print("skip:", a[:40])
          open("game.html", "w", encoding="utf-8").write(s)
          PY
      - name: Generate Android project
        run: |
          set -e
          D=app/src/main
          mkdir -p $D/java/com/smena/zavod $D/assets $D/res/mipmap-xxxhdpi $D/res/values
          cp game.html $D/assets/index.html
          cp icon.png $D/res/mipmap-xxxhdpi/ic_launcher.png
          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
            repositories { google(); mavenCentral() }
          }
          rootProject.name = "SmenaNaZavode"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          echo "org.gradle.jvmargs=-Xmx2g" > gradle.properties
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.smena.zavod'
            compileSdk 34
            defaultConfig {
              applicationId 'com.smena.zavod'
              minSdk 21
              targetSdk 34
              versionCode 1
              versionName '1.0'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          EOF
          cat > $D/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">Смена на заводе</string></resources>
          EOF
          cat > $D/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.VIBRATE"/>
            <queries>
              <intent>
                <action android:name="android.intent.action.TTS_SERVICE"/>
              </intent>
            </queries>
            <application
                android:label="@string/app_name"
                android:icon="@mipmap/ic_launcher"
                android:allowBackup="true"
                android:hardwareAccelerated="true"
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen">
              <activity
                  android:name=".MainActivity"
                  android:exported="true"
                  android:screenOrientation="portrait"
                  android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > $D/java/com/smena/zavod/MainActivity.java <<'EOF'
          package com.smena.zavod;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.speech.tts.TextToSpeech;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import java.util.Locale;

          public class MainActivity extends Activity {
            private WebView web;
            private TextToSpeech tts;
            private volatile boolean ttsReady = false;

            public class Bridge {
              @JavascriptInterface
              public void speak(String text, float pitch, float rate, boolean flush) {
                if (!ttsReady || tts == null) return;
                tts.setPitch(pitch);
                tts.setSpeechRate(rate);
                tts.speak(text, flush ? TextToSpeech.QUEUE_FLUSH : TextToSpeech.QUEUE_ADD, null, "v");
              }

              @JavascriptInterface
              public boolean speaking() {
                return ttsReady && tts != null && tts.isSpeaking();
              }

              @JavascriptInterface
              public boolean ready() {
                return ttsReady;
              }

              @JavascriptInterface
              public void stop() {
                if (tts != null) tts.stop();
              }
            }

            @Override
            protected void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              tts = new TextToSpeech(this, status -> {
                if (status == TextToSpeech.SUCCESS) {
                  int r = tts.setLanguage(new Locale("ru", "RU"));
                  ttsReady = r != TextToSpeech.LANG_MISSING_DATA && r != TextToSpeech.LANG_NOT_SUPPORTED;
                }
              });
              web = new WebView(this);
              web.setBackgroundColor(Color.parseColor("#0e1116"));
              WebSettings s = web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              web.addJavascriptInterface(new Bridge(), "AndroidTTS");
              web.setWebViewClient(new WebViewClient());
              web.setWebChromeClient(new WebChromeClient());
              setContentView(web);
              web.loadUrl("file:///android_asset/index.html");
              hideBars();
            }

            private void hideBars() {
              web.setSystemUiVisibility(View.SYSTEM_UI_FLAG_FULLSCREEN
                  | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                  | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                  | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                  | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
            }

            @Override
            public void onWindowFocusChanged(boolean f) {
              super.onWindowFocusChanged(f);
              if (f) hideBars();
            }

            @Override
            protected void onPause() {
              super.onPause();
              web.onPause();
            }

            @Override
            protected void onResume() {
              super.onResume();
              web.onResume();
            }

            @Override
            protected void onDestroy() {
              if (tts != null) {
                tts.stop();
                tts.shutdown();
              }
              super.onDestroy();
            }
          }
          EOF
      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk smena-na-zavode.apk
      - uses: actions/upload-artifact@v4
        with:
          name: smena-na-zavode-apk
          path: smena-na-zavode.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Смена на заводе, сборка ${{ github.run_number }}
          files: smena-na-zavode.apk
